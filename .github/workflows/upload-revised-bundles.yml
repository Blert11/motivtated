name: Upload revised private bundles
# Adds new packages (<ID>.zip) or revised ones (<ID>.rN.zip) from the claude-bundles branch to the private posting-inputs release.
# Never deletes or overwrites an asset; an existing name must already have the identical digest.
'on':
  workflow_dispatch:
    inputs:
      ref:
        description: Branch holding bundles/ and expected.json
        type: string
        default: claude-bundles
permissions:
  contents: write
concurrency:
  group: motivtated-bundle-upload
  cancel-in-progress: false
jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || 'claude-bundles' }}
          persist-credentials: false
      - name: Verify and upload
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$REPO --jq .private)" = "true"
          existing=$(gh api repos/$REPO/releases/tags/posting-inputs --jq '.assets[] | "\(.name) \(.digest)"')
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          exp = json.loads(pathlib.Path('expected.json').read_text())
          for name, digest in exp.items():
              assert re.fullmatch(r'M\d{6}(\.r[0-9]{1,2})?\.zip', name), name
              h = hashlib.sha256(pathlib.Path('bundles', name).read_bytes()).hexdigest()
              assert h == digest, f'{name} digest mismatch'
          print('verified', len(exp))
          PY
          for f in $(python3 -c "import json;print(' '.join(json.load(open('expected.json'))))"); do
            want="sha256:$(python3 -c "import json;print(json.load(open('expected.json'))['$f'])")"
            have=$(echo "$existing" | awk -v n="$f" '$1==n{print $2}')
            if [ -n "$have" ]; then
              test "$have" = "$want" || { echo "$f exists with a different digest; not overwriting"; exit 1; }
              echo "$f already uploaded"; continue
            fi
            gh release upload posting-inputs "bundles/$f" --repo "$REPO"
            got=$(gh api repos/$REPO/releases/tags/posting-inputs --jq ".assets[] | select(.name==\"$f\") | .digest")
            test "$got" = "$want" || { echo "$f upload verification failed"; exit 1; }
            echo "$f uploaded and verified"
          done
