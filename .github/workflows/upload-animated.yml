name: Upload animated story bundles
# Pushing bundles/ + expected.json to claude-bundles-animated uploads them to the animated-inputs release.
# Never deletes or overwrites an asset.
'on':
  push:
    branches: [claude-bundles-animated]
permissions:
  contents: write
concurrency:
  group: motivtated-bundle-upload
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify and upload
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api repos/$REPO/releases/tags/animated-inputs >/dev/null 2>&1 || \
            gh api repos/$REPO/releases -f tag_name=animated-inputs -f target_commitish=main \
              -f name='Animated story inputs' -f body='Bundles for lane 6 and lane 5' -F draft=false -F prerelease=true >/dev/null
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          exp = json.loads(pathlib.Path('expected.json').read_text())
          for name, digest in exp.items():
              assert re.fullmatch(r'[MI]A\d{4}\.zip', name), name
              assert hashlib.sha256(pathlib.Path('bundles', name).read_bytes()).hexdigest() == digest, name
          print('verified', len(exp))
          PY
          existing=$(gh api repos/$REPO/releases/tags/animated-inputs --jq '.assets[] | "\(.name) \(.digest)"')
          for f in $(python3 -c "import json;print(' '.join(json.load(open('expected.json'))))"); do
            want="sha256:$(python3 -c "import json;print(json.load(open('expected.json'))['$f'])")"
            have=$(echo "$existing" | awk -v n="$f" '$1==n{print $2}')
            if [ -n "$have" ]; then
              test "$have" = "$want" || { echo "$f exists with a different digest"; exit 1; }
              echo "$f already uploaded"; continue
            fi
            gh release upload animated-inputs "bundles/$f" --repo "$REPO"
            got=$(gh api repos/$REPO/releases/tags/animated-inputs --jq ".assets[] | select(.name==\"$f\") | .digest")
            test "$got" = "$want" || { echo "$f verification failed"; exit 1; }
            echo "$f uploaded and verified"
          done
