name: Channels probe (read-only)
'on':
  push:
    branches: [channels-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Inspect Pinterest metadata on account 3
        env:
          K3: ${{ secrets.BUFFER_API_KEY_3 }}
        run: |
          python - <<'PY'
          import os, json
          from publisher.buffer import Buffer
          b = Buffer(token=os.environ['K3'])
          def q(s, v=None):
              try: return b.query(s, v)
              except Exception as e: return 'ERR '+str(e)[:400]
          print(json.dumps(q('{ __type(name: "PinterestMetadata") { fields { name type { name kind ofType { name kind ofType { name } } } } } }')))
          print(json.dumps(q('{ __type(name: "PinterestBoard") { fields { name } } }')))
          print(json.dumps(q('{ __type(name: "Channel") { fields { name } } }')))
          for cid in ('6af8c55c62b70b94b032ae68','6af8c5c962b70b94b032b22e'):
              print(cid, json.dumps(q('query($i: ChannelInput!) { channel(input: $i) { name service metadata { __typename ... on PinterestMetadata { boards { serviceId name } } } } }', {'i': {'id': cid}})))
          PY
