name: Channels probe (read-only)
'on':
  push:
    branches: [channels-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Read back pin cover offsets (account 3)
        env:
          K3: ${{ secrets.BUFFER_API_KEY_3 }}
        run: |
          python - <<'PY'
          import os, json
          from publisher.buffer import Buffer
          b = Buffer(token=os.environ['K3'])
          for pid in ('6af8cbccc5b364e062174306','6af8cbd4b9a106584c6c460d'):
              print(json.dumps(b.post(pid))[:900])
          PY
