name: Lane 2 publisher (YouTube Shorts + X, second Buffer account)
# Separate from the TikTok/Instagram/Facebook scheduler: own key, plan and ledger (lane2-state.json).
'on':
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:
  push:
    branches: [lane2-kick]
permissions:
  contents: write
concurrency:
  group: motivtated-publisher-single-writer
  cancel-in-progress: false
jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Ensure ffprobe is installed
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Offline tests
        run: python -m unittest tests.test_lane2 -v
      - name: Reconcile and refill lane 2
        run: python -m publisher.lane2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUFFER_API_KEY_2: ${{ secrets.BUFFER_API_KEY_2 }}
          MEDIA_GITHUB_TOKEN: ${{ secrets.MEDIA_GITHUB_TOKEN }}
          MEDIA_PUBLIC_BASE_URL: ${{ vars.MEDIA_PUBLIC_BASE_URL }}
          MEDIA_GITHUB_REPOSITORY: ${{ vars.MEDIA_GITHUB_REPOSITORY }}
