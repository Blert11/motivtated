name: Lane 6 publisher (animated stories, TikTok + Instagram + Facebook)
# One animated story a day per page at 18:00. Motivtated on the first Buffer account, Imanivated on the fourth.
'on':
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: motivtated-publisher-single-writer
  cancel-in-progress: false
jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Ensure ffprobe is installed
        timeout-minutes: 12
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            if ! (timeout 240 sudo apt-get update -o Acquire::Retries=2 && timeout 300 sudo apt-get install -y --no-install-recommends ffmpeg); then
              python -m pip install static-ffmpeg
              dir=$(python -c "import static_ffmpeg.run as r, os; print(os.path.dirname(r.get_or_fetch_platform_executables_else_raise()[1]))")
              echo "$dir" >> "$GITHUB_PATH"
            fi
          fi
      - name: Offline tests
        run: python -m unittest tests.test_lane6 -v
      - name: Motivtated
        continue-on-error: true
        run: python -m publisher.lane6 --page motivtated
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          MEDIA_GITHUB_TOKEN: ${{ secrets.MEDIA_GITHUB_TOKEN }}
          MEDIA_PUBLIC_BASE_URL: ${{ vars.MEDIA_PUBLIC_BASE_URL }}
          MEDIA_GITHUB_REPOSITORY: ${{ vars.MEDIA_GITHUB_REPOSITORY }}
      - name: Imanivated
        continue-on-error: true
        run: python -m publisher.lane6 --page imanivated
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUFFER_API_KEY_4: ${{ secrets.BUFFER_API_KEY_4 }}
          MEDIA_GITHUB_TOKEN: ${{ secrets.MEDIA_GITHUB_TOKEN }}
          MEDIA_PUBLIC_BASE_URL: ${{ vars.MEDIA_PUBLIC_BASE_URL }}
          MEDIA_GITHUB_REPOSITORY: ${{ vars.MEDIA_GITHUB_REPOSITORY }}
