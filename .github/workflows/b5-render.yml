name: Imanivated batch 5 render
'on':
  push:
    branches: [b5-render]
permissions:
  contents: read
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      cids: ${{ steps.l.outputs.cids }}
    steps:
      - uses: actions/checkout@v4
        with: {sparse-checkout: render.json, sparse-checkout-cone-mode: false}
      - id: l
        run: echo "cids=$(python3 -c 'import json;print(json.dumps(json.load(open("render.json"))))')" >> $GITHUB_OUTPUT
  render:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        cid: ${{ fromJSON(needs.list.outputs.cids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Setup
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0 libfribidi0 >/dev/null
          pip install -q numpy opencv-python-headless pillow soundfile scipy onnxruntime
          python -c "from PIL import features; assert features.check('raqm')"
          sudo mkdir -p /home/claude /mnt/user-data/uploads/imanivated && sudo chown -R $USER /home/claude /mnt/user-data
          ln -s $GITHUB_WORKSPACE/w /home/claude/w; ln -s $GITHUB_WORKSPACE/fonts /home/claude/fonts; ln -s $GITHUB_WORKSPACE/models /home/claude/models
          cp "logo/Logo PNG White.png" "/mnt/user-data/uploads/imanivated/"
          mkdir -p /home/claude/w/out
          if grep -q '"blur": true' w/b5/clips.json; then curl -sSfL -o models/u2net_human_seg.onnx https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2net_human_seg.onnx; fi
      - name: Render
        run: |
          cd /home/claude/w
          B5_SRC_DIR=$GITHUB_WORKSPACE/cuts python b5/clip5.py ${{ matrix.cid }}
          ls -la out/${{ matrix.cid }}/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cid }}
          path: /home/claude/w/out/${{ matrix.cid }}/${{ matrix.cid }}_o.mp4
          retention-days: 5
