name: MOTIVTATED scheduled publisher
'on':
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      reviewed_schedule_edit:
        description: Optional exact record for a reviewed same-ID edit retry (M000012:tiktok)
        type: string
        default: ''
permissions:
  contents: write
  actions: write
concurrency:
  group: motivtated-publisher-single-writer
  cancel-in-progress: false
jobs:
  refill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Ensure ffprobe is installed
        timeout-minutes: 12
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            # apt mirrors have hung for over an hour on some runners; fall back to a static build
            if ! (timeout 240 sudo apt-get update -o Acquire::Retries=2 && timeout 300 sudo apt-get install -y --no-install-recommends ffmpeg); then
              python -m pip install static-ffmpeg
              dir=$(python -c "import static_ffmpeg.run as r, os; print(os.path.dirname(r.get_or_fetch_platform_executables_else_raise()[1]))")
              echo "$dir" >> "$GITHUB_PATH"
            fi
          fi
      - name: Offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Reconcile, refill, and clean completed media
        run: python -m publisher.scheduler
        env:
          REVIEWED_SCHEDULE_EDIT: ${{ inputs.reviewed_schedule_edit }}
          GITHUB_TOKEN: ${{ github.token }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          MEDIA_GITHUB_TOKEN: ${{ secrets.MEDIA_GITHUB_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MEDIA_PROVIDER: ${{ vars.MEDIA_PROVIDER }}
          MEDIA_PUBLIC_BASE_URL: ${{ vars.MEDIA_PUBLIC_BASE_URL }}
          MEDIA_GITHUB_REPOSITORY: ${{ vars.MEDIA_GITHUB_REPOSITORY }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          BUFFER_TIKTOK_CHANNEL_ID: ${{ vars.BUFFER_TIKTOK_CHANNEL_ID }}
          BUFFER_INSTAGRAM_CHANNEL_ID: ${{ vars.BUFFER_INSTAGRAM_CHANNEL_ID }}
          BUFFER_FACEBOOK_CHANNEL_ID: ${{ vars.BUFFER_FACEBOOK_CHANNEL_ID }}
